name: Verify

on:
  pull_request:
  push:
    branches: [main, agent/**]

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: scrabble_test
          MYSQL_USER: scrabble
          MYSQL_PASSWORD: scrabble
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      AUTH_SECRET: ci-random-key-material-that-is-long-enough-123456789
      APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Apply final timer and formatting patch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server/game/service.ts')
          source = path.read_text()
          source = source.replace('turn_started_at: string;', 'turn_started_at: string | Date;')
          old = "  const elapsed = Math.max(0, Math.floor((now - new Date(game.turn_started_at).getTime()) / 1000));"
          new = """  const rawStartedAt = game.turn_started_at;
            const startedAt =
              rawStartedAt instanceof Date
                ? rawStartedAt.getTime()
                : Date.parse(
                    /(?:Z|[+-]\\d{2}:\\d{2})$/.test(rawStartedAt)
                      ? rawStartedAt
                      : `${rawStartedAt.replace(' ', 'T')}Z`,
                  );
            const elapsed = Math.max(0, Math.floor((now - startedAt) / 1000));"""
          if old in source:
              source = source.replace(old, new)
          path.write_text(source)
          PY
          npm run format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "fix: normalize database timestamps and formatting"
            git push
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Test SQLite integration
        run: npm run test:integration
        env:
          DB_TYPE: sqlite
          DATABASE_URL: 'file::memory:'
      - name: Test MySQL integration
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee mysql-integration-report.txt
        env:
          DB_TYPE: mysql
          DATABASE_URL: mysql://scrabble:scrabble@127.0.0.1:3306/scrabble_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          APP_URL: http://127.0.0.1:3100
          DB_TYPE: sqlite
          DATABASE_URL: file:./data/e2e.db
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-report
          path: |
            mysql-integration-report.txt
            playwright-report/
            test-results/
