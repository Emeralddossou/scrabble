name: Verify

on:
  pull_request:
  push:
    branches: [main, agent/**]

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: scrabble_test
          MYSQL_USER: scrabble
          MYSQL_PASSWORD: scrabble
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      AUTH_SECRET: ci-random-key-material-that-is-long-enough-123456789
      APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Apply free-mode bot timer fix
        if: github.event_name == 'push' && github.ref_name == 'agent/solo-ai-account-features'
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/game/service.ts')
          source = path.read_text()
          source = source.replace(
              '  if (currentRemaining(game, bot) <= 0) return;',
              "  if (game.mode === 'timer' && currentRemaining(game, bot) <= 0) return;",
          )
          path.write_text(source)
          PY
          npm run format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "fix: let solo bots play free games"
            git push
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Test SQLite integration
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee sqlite-integration-report.txt
        env:
          DB_TYPE: sqlite
          DATABASE_URL: 'file::memory:'
      - name: Test MySQL integration
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee mysql-integration-report.txt
        env:
          DB_TYPE: mysql
          DATABASE_URL: mysql://scrabble:scrabble@127.0.0.1:3306/scrabble_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          APP_URL: http://127.0.0.1:3100
          DB_TYPE: sqlite
          DATABASE_URL: file:./data/e2e.db
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-report
          path: |
            sqlite-integration-report.txt
            mysql-integration-report.txt
            playwright-report/
            test-results/
