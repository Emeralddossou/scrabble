name: Verify

on:
  pull_request:
  push:
    branches: [main, agent/**]

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: scrabble_test
          MYSQL_USER: scrabble
          MYSQL_PASSWORD: scrabble
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      AUTH_SECRET: ci-random-key-material-that-is-long-enough-123456789
      APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Apply solo AI and dashboard integration
        if: github.event_name == 'push' && github.ref_name == 'agent/solo-ai-account-features'
        run: |
          python - <<'PY'
          from pathlib import Path

          service_path = Path('server/game/service.ts')
          service = service_path.read_text()
          service = service.replace(
              "import { suggestMoves } from '@/server/game/suggestions';",
              "import { chooseAiMove, suggestMoves, type AiLevel } from '@/server/game/suggestions';",
          )
          service = service.replace(
              "  aiLevel?: 'easy' | 'medium' | 'hard';",
              "  aiLevel?: AiLevel;",
          )
          marker = service.index('async function maybePlayAi')
          service = service[:marker] + r'''function chooseAiExchange(rack: Tile[], level: AiLevel): string[] {
            const letterValue = (tile: Tile): number => {
              if (tile.letter === '*') return 20;
              if ('ERSAITN'.includes(tile.letter)) return 7;
              if ('LODU'.includes(tile.letter)) return 4;
              if ('QJKWXYZ'.includes(tile.letter)) return -5;
              return 1;
            };
            const sorted = [...rack].sort((left, right) => letterValue(left) - letterValue(right));
            const maximum = level === 'expert' ? 5 : level === 'hard' ? 4 : level === 'medium' ? 3 : 2;
            const undesirable = sorted.filter((tile) => letterValue(tile) <= 1).slice(0, maximum);
            return (undesirable.length ? undesirable : sorted.slice(0, Math.min(2, sorted.length))).map(
              (tile) => tile.id,
            );
          }

          function normalizedAiLevel(value: unknown): AiLevel {
            return value === 'easy' || value === 'hard' || value === 'expert' ? value : 'medium';
          }

          async function maybePlayAi(gameId: number): Promise<void> {
            const db = await getDb();
            const game = (
              await db.query<GameRow>(
                "SELECT * FROM games WHERE id=? AND status='active' AND is_solo=1",
                [gameId],
              )
            )[0];
            if (!game) return;
            const bot = (
              await db.query<PlayerRow>('SELECT * FROM game_players WHERE game_id=? AND user_id=?', [
                gameId,
                game.current_player_id,
              ])
            )[0];
            if (!bot) return;
            const name = (await db.query<Row>('SELECT username FROM users WHERE id=?', [bot.user_id]))[0]
              ?.username;
            if (typeof name !== 'string' || !name.startsWith('LexiBot-')) return;
            if (currentRemaining(game, bot) <= 0) return;

            const level = normalizedAiLevel(game.ai_level);
            const rack = parse<Tile[]>(bot.rack);
            const budget = level === 'expert' ? 1800 : level === 'hard' ? 1400 : level === 'medium' ? 1000 : 700;
            const options = await suggestMoves(parse<Board>(game.board), rack, 48, budget);
            const actionId = `ai-${game.id}-${game.version}-${randomUUID()}`;
            const pick = chooseAiMove(options, level, `${game.id}:${game.version}:${bot.user_id}`);
            if (pick) {
              await playMove({
                gameId,
                userId: Number(bot.user_id),
                placements: pick.placements,
                expectedVersion: Number(game.version),
                actionId,
              });
              return;
            }

            const bag = parse<Tile[]>(game.bag);
            const exchangeIds = bag.length >= 7 ? chooseAiExchange(rack, level) : [];
            await gameAction({
              gameId,
              userId: Number(bot.user_id),
              kind: exchangeIds.length ? 'exchange' : 'pass',
              tileIds: exchangeIds,
              expectedVersion: Number(game.version),
              actionId,
            });
          }
          '''
          service_path.write_text(service)

          dashboard_path = Path('app/dashboard/page.tsx')
          dashboard = dashboard_path.read_text()
          dashboard = dashboard.replace(
              "import { cached, putCache, rpc } from '@/lib/client';",
              "import { SoloLauncher } from '@/components/solo-launcher';\nimport { cached, putCache, rpc } from '@/lib/client';",
          )
          dashboard = dashboard.replace(
              """  async function solo(): Promise<void> {
              const result = await rpc<{ gameId: number }>('createSolo', {
                mode: 'free',
                timeLimit: 15,
                increment: 0,
              });
              router.push(`/game/${result.gameId}`);
            }

          """,
              "",
          )
          dashboard = dashboard.replace(
              '<button onClick={() => void solo()}>Entraînement solo</button>',
              "<SoloLauncher />\n          <button className=\"quiet\" onClick={() => router.push('/profile')}>Mon profil</button>",
          )
          dashboard_path.write_text(dashboard)
          PY
          npm run format
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "feat: integrate advanced solo AI and account navigation"
            git push
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Test SQLite integration
        run: npm run test:integration
        env:
          DB_TYPE: sqlite
          DATABASE_URL: 'file::memory:'
      - name: Test MySQL integration
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee mysql-integration-report.txt
        env:
          DB_TYPE: mysql
          DATABASE_URL: mysql://scrabble:scrabble@127.0.0.1:3306/scrabble_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          APP_URL: http://127.0.0.1:3100
          DB_TYPE: sqlite
          DATABASE_URL: file:./data/e2e.db
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-report
          path: |
            mysql-integration-report.txt
            playwright-report/
            test-results/
