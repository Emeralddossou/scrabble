name: CI/CD - Build & Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & Validate
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: pdo, mysql
          tools: phpcs
      
      - name: Validate PHP Syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;
      
      - name: Check PHP Standards
        run: |
          phpcs --standard=PSR2 backend/*.php backend/api/*.php --ignore=backend/logs 2>/dev/null || true
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '16'
      
      - name: Validate JavaScript
        run: |
          npm install -g jshint 2>/dev/null || true
          jshint js/*.js 2>/dev/null || echo "JavaScript check completed"

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    needs: lint
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: pdo, mysql
          tools: composer, phpunit
      
      - name: Setup MySQL
        uses: ankane/setup-mysql@v1
        with:
          mysql-version: 8.0
      
      - name: Setup Test Database
        run: |
          mysql -uroot -e "CREATE DATABASE IF NOT EXISTS scrabble_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql -uroot -e "CREATE USER IF NOT EXISTS 'scrabble_test'@localhost IDENTIFIED BY 'test_password';"
          mysql -uroot -e "GRANT ALL PRIVILEGES ON scrabble_test.* TO 'scrabble_test'@localhost;"
          mysql -uroot -e "FLUSH PRIVILEGES;"
      
      - name: Create .env for Tests
        run: |
          cat > .env << EOF
          DB_TYPE=mysql
          DB_HOST=localhost
          DB_PORT=3306
          DB_USER=scrabble_test
          DB_PASS=test_password
          DB_NAME=scrabble_test
          DB_ALLOW_FALLBACK=false
          APP_ENV=testing
          APP_DEBUG=true
          EOF
      
      - name: Install PHPUnit
        run: |
          composer require --dev phpunit/phpunit --no-interaction || wget https://phar.phpunit.de/phpunit-9.phar
          chmod +x phpunit-9.phar || true
      
      - name: Run Unit Tests
        run: |
          cd /home/runner/work/scrabble/scrabble
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit tests/
          elif [ -f phpunit-9.phar ]; then
            php phpunit-9.phar tests/
          else
            echo "PHPUnit not found, skipping tests"
          fi

  deploy:
    runs-on: ubuntu-latest
    name: Deploy via SSH
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Create .env for Production
        run: |
          cat > .env << EOF
          DB_TYPE=mysql
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_ALLOW_FALLBACK=false
          SSH_HOST=${{ secrets.SSH_HOST }}
          SSH_USER=${{ secrets.SSH_USER }}
          SSH_PORT=${{ secrets.SSH_PORT }}
          APP_ENV=production
          APP_DEBUG=false
          EOF
          cp .env env.production
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      
      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            cd /var/www/html
            git pull origin main
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
          ENDSSH
      
      - name: Deploy Summary
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "App deployed to: ${{ secrets.SSH_HOST }}"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Check logs above."
          exit 1
